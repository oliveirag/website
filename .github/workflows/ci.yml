name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Matches the Node version Vercel builds with (project setting: 24.x)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uses the @playwright/test version from package-lock.json, so the
      # browser build always matches the pinned test runner
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds the site, serves it on 127.0.0.1:4329 and runs tests/.
      # The html reporter is added on top of the configured list reporter
      # so a failed run leaves playwright-report/ to download.
      - name: Build and test
        run: npm test -- --add-reporter=html
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
